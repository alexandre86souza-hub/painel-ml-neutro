<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devoluções</title>
<link rel="stylesheet" href="/paginas.css?v=1">
<link rel="stylesheet" href="/layout.css?v=2">
<link rel="stylesheet" href="/tema-hn.css?v=4">
<link rel="stylesheet" href="/tema-painel.css?v=3">
<link rel="stylesheet" href="/tema-escuro.css?v=4">
<link rel="stylesheet" href="/tema-escuro-paginas.css?v=1">
<script src="/tema.js?v=1"></script>
<style>
  .cartao.destaque{background:linear-gradient(135deg,var(--cor-canal,#232f3e),var(--cor-canal2,#ff9900));border-color:transparent;color:#fff}
  .cartao.destaque .rotulo,.cartao.destaque .nota{color:#fff3df}
  .chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#eef1f6;color:#475569;white-space:nowrap}
  .chip.amarelo{background:#fff4d6;color:#7a5600}
  td.dinheiro{white-space:nowrap;text-align:right}
  .prod{display:flex;gap:8px;align-items:center;min-width:300px}.prod img{width:40px;height:40px;object-fit:cover;border-radius:6px;background:#f1f5f9}
  #lista td{white-space:nowrap}#lista td:first-child{white-space:normal}
  #lista tr.pecas td{border-top:0;padding-top:0;white-space:normal}
  .pecas-lista{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca" id="marcaPainel"></div>
    <nav id="menuPainel" aria-label="Telas do painel"></nav>
    <script src="/menu.js?v=36"></script>
  </aside>
  <div class="conteudo">
<header>
  <h1 id="titulo">Devoluções</h1>
  <div id="barraContas">
    <label for="selConta" id="rotuloConta">Conta</label>
    <select id="selConta" aria-describedby="rotuloConta"></select>
  </div>
</header>
<main>
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="topo">
    <p id="topoTxt"></p>
    <div class="seg" role="group" aria-label="Período" id="segDias">
      <button type="button" data-dias="30">30 dias</button>
      <button type="button" data-dias="60">60 dias</button>
      <button type="button" data-dias="90">90 dias</button>
    </div>
  </div>
  <div class="cartoes" id="cartoes"><p class="carregando">Carregando…</p></div>
  <section class="bloco">
    <h2>Produtos que mais voltam</h2>
    <div class="tabela-rolagem" id="produtos"></div>
  </section>
  <section class="bloco">
    <h2>Devoluções</h2>
    <div class="filtros"><input id="busca" type="search" placeholder="Buscar por pedido, produto ou SKU" aria-label="Buscar devolução"></div>
    <div class="tabela-rolagem" id="lista"></div>
  </section>
</main>
  </div>
</div>
<script src="/comum.js?v=8"></script>
<script src="/defeito-pecas.js?v=1"></script>
<script>
// Devoluções da Amazon, Leroy e Magalu (?conta=amazon|leroy|magalu): GET /api/{canal}/devolucoes, todas no mesmo formato.
// Nada desta tela vai para o MCP.
const CANAL = ['leroy', 'magalu'].includes(new URLSearchParams(location.search).get('conta')) ? new URLSearchParams(location.search).get('conta') : 'amazon';
const NOME = { amazon: 'Amazon', leroy: 'Leroy Merlin', magalu: 'Magalu' }[CANAL];
document.documentElement.style.setProperty('--cor-canal', { amazon: '#232f3e', leroy: '#3d6e0f', magalu: '#005bb5' }[CANAL]);
document.documentElement.style.setProperty('--cor-canal2', { amazon: '#ff9900', leroy: '#78be20', magalu: '#0086ff' }[CANAL]);
$('titulo').textContent = 'Devoluções — ' + NOME; document.title = 'Devoluções ' + NOME;
const TOPO = { amazon: 'Devoluções (reembolsos) da Amazon com o custo de cada uma: tarifas e frete que a Amazon cobrou na venda e no reembolso e não devolveu. O valor devolvido ao cliente sai do faturamento. Sem dados do comprador.',
  leroy: 'Vendas da Leroy com reembolso ao cliente e o custo de cada uma: a comissão que a Leroy não devolveu e o frete que você pagou na entrega. O valor devolvido sai do faturamento.',
  magalu: 'Pedidos da Magalu com reembolso (análise financeira) e o custo de cada um: as tarifas que ficaram e o frete debitado. O valor devolvido sai do faturamento.' }[CANAL];
$('topoTxt').textContent = TOPO;
let dias = 90, dados = null;
function cartao(rot, valor, nota, destaque){
  const c = el('div', 'cartao' + (destaque ? ' destaque' : ''));
  c.append(el('p', 'rotulo', rot), el('div', 'valor', valor), el('p', 'nota', nota || ''));
  return c;
}
const dataBR = (iso) => (iso ? new Date(iso).toLocaleDateString('pt-BR') : '—');
function custoTd(d){
  const td = el('td', 'dinheiro ' + (d.custo > 0 ? 'neg' : ''), real(d.custo));
  if(d.pecas_defeito) td.appendChild(el('span', 'pequeno', `com ${real(d.pecas_defeito)} de peças com defeito`));
  return td;
}
function pintarLista(){
  const qv = $('busca').value.trim().toLowerCase();
  const itens = dados.devolucoes.filter((d) => !qv || [d.pedido, d.sku, d.titulo].some((x) => String(x || '').toLowerCase().includes(qv)));
  const tab = el('table'); const cab = el('tr');
  for(const h of ['Produto', 'Venda', 'Devolução', 'Envio', 'Valor da venda', 'Devolvido ao cliente', 'Tarifas e frete da venda', 'Tarifas e frete do reembolso', 'Custo da devolução', '']) cab.appendChild(el('th', null, h));
  const th = el('thead'); th.appendChild(cab); tab.appendChild(th); const tb = el('tbody');
  for(const d of itens){
    const tr = el('tr');
    const t0 = el('td'); const p = el('div', 'prod'); const im = el('img'); im.alt = ''; im.loading = 'lazy'; if(d.foto) im.src = d.foto;
    const cx = el('div'); cx.appendChild(document.createTextNode(d.titulo || d.sku || 'item'));
    cx.appendChild(el('span', 'pequeno', `${d.sku || 'sem SKU'} × ${numero(d.quantidade)} · pedido ${d.pedido}`));
    if(d.parcial) cx.appendChild(el('span', 'chip amarelo', 'reembolso parcial'));
    p.append(im, cx); t0.appendChild(p);
    const t9 = el('td'); const a = el('a', null, 'Ver'); a.href = d.link; a.target = '_blank'; a.rel = 'noopener'; t9.appendChild(a);
    tr.append(t0, el('td', null, dataBR(d.data_venda)), el('td', null, d.data ? dataBR(d.data) : '—'), el('td', null, d.envio || (d.canal === 'FBA' ? 'FBA' : 'envio próprio')),
      el('td', 'dinheiro', d.valor_venda == null ? 'fora do período lido' : real(d.valor_venda)), el('td', 'dinheiro', real(d.devolvido)),
      el('td', 'dinheiro', d.tarifas_venda == null ? '—' : real((d.tarifas_venda || 0) + (d.frete_venda || 0)) + (d.frete_desconhecido ? ' (sem o frete)' : '')),
      el('td', 'dinheiro', d.tarifas_reembolso == null ? '—' : real(d.tarifas_reembolso + d.frete_reembolso)), custoTd(d), t9);
    tb.appendChild(tr);
    // peças com defeito (a mesma marcação das devoluções do ML): o que não estiver marcado volta ao estoque
    if(d.pecas?.length || d.canal === 'FBA'){
      const tr2 = el('tr', 'pecas'); const td = el('td'); td.colSpan = 10; const box = el('div', 'pecas-lista');
      if(d.canal === 'FBA') box.appendChild(el('span', 'pequeno', 'Devolução do FBA: o produto volta ao armazém da Amazon, fora do seu estoque.'));
      else for(const pc of d.pecas) box.appendChild(blocoDefeito(pc, { origem: NOME, aoSalvar: () => carregar(true) }));
      td.appendChild(box); tr2.appendChild(td); tb.appendChild(tr2);
    }
  }
  if(!itens.length){ const tr = el('tr'); const td = el('td', null, 'Nenhuma devolução por aqui.'); td.colSpan = 10; tr.appendChild(td); tb.appendChild(tr); }
  tab.appendChild(tb); $('lista').innerHTML = ''; $('lista').appendChild(tab);
}
// silencioso: depois de conferir uma devolução, relê sem apagar a tela nem perder a rolagem
async function carregar(silencioso){
  erroTela('');
  if(!silencioso){ $('cartoes').innerHTML = ''; $('cartoes').appendChild(el('p', 'carregando', `Lendo as vendas da ${NOME}…`)); }
  const rolagem = window.scrollY;
  try{
    dados = await api(`/api/${CANAL}/devolucoes?dias=${dias}`);
    if(dados.conectada === false){ erroTela(`Conecte a ${NOME} na tela de conexão.`); $('cartoes').innerHTML = ''; return; }
    if(dados.erro_leitura) erroTela(`Não consegui ler as novidades da ${NOME} agora (${dados.erro_leitura}). Os números são da última leitura.`);
    const r = dados.resumo;
    const box = $('cartoes'); box.innerHTML = '';
    box.append(
      cartao(`Custo das devoluções em ${dias} dias`, real(r.custo), `tarifas e frete que a ${NOME} não devolveu` + (r.pecas_defeito ? ` + ${real(r.pecas_defeito)} de peças com defeito` : '') + (r.sem_frete ? ` · ${numero(r.sem_frete)} sem o frete informado` : ''), true),
      cartao('Devoluções', numero(r.casos), `${numero(r.unidades)} unidade(s)` + (CANAL === 'amazon' ? ` · ${numero(r.fba)} do FBA` : '') + ` · ${numero(r.parciais)} parcial(is)`),
      cartao('Devolvido aos clientes', real(r.devolvido), 'sai do faturamento'),
      cartao('Taxa de devolução', r.taxa == null ? '—' : pct(r.taxa), `${numero(r.unidades)} de ${numero(r.vendidas)} unidade(s) vendidas no período`),
      cartao('Peças com defeito', real(r.pecas_defeito || 0), r.conferir ? `${numero(r.conferir)} item(ns) para conferir quando chegar` : 'custo das peças marcadas (não voltam à venda)'),
    );
    const tab = el('table'); const cab = el('tr'); for(const h of ['Produto', 'Devoluções', 'Unidades', 'Devolvido', 'Custo']) cab.appendChild(el('th', null, h));
    const th = el('thead'); th.appendChild(cab); tab.appendChild(th); const tb = el('tbody');
    for(const m of dados.por_produto){ const tr = el('tr'); const t0 = el('td'); t0.appendChild(document.createTextNode(m.titulo || m.sku || '—')); t0.appendChild(el('span', 'pequeno', m.sku || ''));
      tr.append(t0, el('td', null, numero(m.casos)), el('td', null, numero(m.unidades)), el('td', 'dinheiro', real(m.devolvido)), el('td', 'dinheiro', real(m.custo))); tb.appendChild(tr); }
    if(!dados.por_produto.length){ const tr = el('tr'); const td = el('td', null, 'Nenhuma devolução no período.'); td.colSpan = 5; tr.appendChild(td); tb.appendChild(tr); }
    tab.appendChild(tb); $('produtos').innerHTML = ''; $('produtos').appendChild(tab);
    $('topoTxt').textContent = TOPO + (dados.nota ? ' ' + dados.nota : '');
    pintarLista();
    if(silencioso) window.scrollTo(0, rolagem);
  }catch(e){ erroTela(e.message); if(!silencioso) $('cartoes').innerHTML = ''; }
}
$('busca').oninput = () => dados && pintarLista();
periodo('segDias', dias, (d) => { dias = d; carregar(); });
carregar();
</script>
<script src="/sino.js?v=4" defer></script>
</body>
</html>
