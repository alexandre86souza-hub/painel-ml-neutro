<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas fiscais (Bling)</title>
<link rel="stylesheet" href="/paginas.css?v=1">
<link rel="stylesheet" href="/layout.css?v=2">
<link rel="stylesheet" href="/tema-hn.css?v=4">
<link rel="stylesheet" href="/tema-painel.css?v=3">
<link rel="stylesheet" href="/tema-escuro.css?v=4">
<link rel="stylesheet" href="/tema-escuro-paginas.css?v=1">
<link rel="stylesheet" href="/ds.css?v=2">
<script src="/tema.js?v=2"></script>
<style>
  #msg.ok{display:block;background:#e6f4ea;color:#0b6b33;border:1px solid #a8dab5}
  button.bt.primario{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.bt:disabled{opacity:.5;cursor:default}
  /* resumo e filtros */
  .resumo{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin-bottom:14px}
  .num{flex:1 1 170px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;text-align:left;font:inherit}
  .num b{display:block;font-size:26px;line-height:1.1}
  .num span{font-size:13px;color:var(--muted)}
  .num.ajustar b{color:#b54708}
  .num.emitir b{color:#0b6b33}
  .num.rejeitada b{color:#b42318}
  .num.ativo{outline:2px solid var(--brand);outline-offset:-1px}
  .abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .abas button{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
  .abas button.ativa{color:var(--brand);border-bottom-color:var(--brand)}
  .abas button span{display:inline-block;min-width:20px;margin-left:6px;padding:1px 7px;border-radius:999px;background:#eef2f7;color:#344054;font-size:12px}
  .abas button span.tem{background:#fef0c7;color:#93370d}
  .barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .barra .sub{font-size:12px;color:var(--muted)}
  /* notas */
  .lista{display:grid;gap:12px}
  .nota{border:1px solid var(--line);border-left:5px solid #f79009;border-radius:12px;padding:12px 14px;background:#fff;min-width:0}
  .nota.ok{border-left-color:#12b76a}
  .nota.rej{border-left-color:#d92d20}
  .nota header{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin-bottom:8px;padding:0;background:none;border:0;position:static}
  .nota h3{margin:0;font-size:15px}
  .etq{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eef2f7;color:#344054;white-space:nowrap}
  .etq.ajustar{background:#fef0c7;color:#93370d}
  .etq.emitir{background:#d1fadf;color:#05603a}
  .etq.rej{background:#fee4e2;color:#912018}
  .nota .info{font-size:12px;color:var(--muted)}
  .rolar{overflow-x:auto}
  .nota table{border-collapse:collapse;font-size:13px;width:100%;min-width:640px}
  .nota td,.nota th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
  .nota th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .nota input,.nota select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #d5dbe5;border-radius:6px;background:#fff;width:100%}
  .nota input.ncm{width:110px}
  .nota input.mudou,.nota select.mudou{border-color:#f79009;background:#fffaeb}
  .antes{font-size:11px;color:var(--muted);margin-top:3px}
  .salvo{font-size:11px;color:#0b6b33;margin-top:3px}
  .codigo s{color:#b42318}
  .acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .res{font-size:13px}
  .res.erro{color:#b42318}
  .res.ok{color:#0b6b33;font-weight:600}
  .vazio-grande{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
  .vazio-grande b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
  /* como funciona */
  ol.passos{display:flex;gap:10px;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 14px;counter-reset:p}
  ol.passos li{flex:1 1 200px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 10px;counter-increment:p}
  ol.passos li::before{content:counter(p);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;margin-right:6px}
  ol.passos b{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca" id="marcaPainel"></div>
    <nav id="menuPainel" aria-label="Telas do painel"></nav>
    <script src="/menu.js?v=40"></script>
  </aside>
  <div class="conteudo">
<header>
  <h1>Notas fiscais (Bling)</h1>
  <div id="barraContas">
    <label for="selConta" id="rotuloConta">Conta</label>
    <select id="selConta" aria-describedby="rotuloConta"></select>
  </div>
</header>
<main>
  <div id="msg" role="status" aria-live="polite"></div>

  <ol class="passos">
    <li>No Bling, gere a <b>nota do pedido</b> (sem editar e sem emitir).</li>
    <li>Aqui, confira <b>nome curto, NCM e origem</b> e clique em <b>Ajustar no Bling</b> (o código sai vazio).</li>
    <li>No Bling, abra a nota, confira e <b>emita</b>.</li>
  </ol>

  <div class="abas" id="abas" role="tablist" aria-label="Conta do Bling"></div>
  <div class="resumo" id="resumo">
    <button type="button" class="num ajustar" data-f="ajustar"><b id="nAjustar">—</b><span>falta ajustar</span></button>
    <button type="button" class="num emitir" data-f="emitir"><b id="nEmitir">—</b><span>ajustadas · falta emitir no Bling</span></button>
    <button type="button" class="num rejeitada" data-f="rej"><b id="nRej">—</b><span>rejeitadas pela Sefaz</span></button>
  </div>
  <div class="barra">
    <button type="button" class="bt" id="btAtualizar">Atualizar</button>
    <button type="button" class="bt" id="btTodas">Mostrar todas</button>
    <span class="sub" id="lidoEm"></span>
  </div>
  <div class="lista" id="lista"><p class="carregando">Lendo as notas no Bling…</p></div>

</main>
  </div>
</div>
<script src="/comum.js?v=9"></script>
<script>
const enviar = (m, caminho, corpo) => api(caminho, { method: m, headers:{'Content-Type':'application/json'}, body: JSON.stringify(corpo || {}) });
function aviso(t, tipo){ const m = $('msg'); m.className = tipo === 'ok' ? 'ok' : ''; m.textContent = t; m.style.display = t ? 'block' : 'none'; if(t) m.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
const dia = (s) => { if(!s) return ''; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? String(s) : d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }); };
const reais = (v) => (v == null ? '—' : Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }));
const ORIGEM_TXT = { 0: '0 · Nacional', 1: '1 · Estrangeira, importação direta', 2: '2 · Estrangeira, adquirida no mercado interno' };
const origemDe = (conta, nacional) => (nacional ? 0 : conta === '1' ? 1 : 2);
// loja pelo formato do número do pedido (o Bling só dá o id da loja)
const lojaPeloPedido = (p) => { const s = String(p || ''); if(/^\d{3}-\d{7}-\d{7}$/.test(s)) return 'Amazon'; if(/^\d{6}[0-9A-Z]{6,10}$/.test(s)) return 'Shopee'; if(/^LU-/i.test(s)) return 'Magalu'; return null; };

let cfg = null, notas = [], filtro = null;
// aba: '' = as duas contas, '1' = AMG, '2' = Primor (lembrada neste navegador)
let aba = (() => { try{ return localStorage.getItem('bling_aba') || ''; }catch{ return ''; } })();
const estado = (n) => (Number(n.situacao) === 4 ? 'rej' : n.ajustada ? 'emitir' : 'ajustar');

// ---------- notas das duas contas ----------
async function lerNotas(){
  $('btAtualizar').disabled = true;
  const contas = (cfg?.contas || []).filter((c) => c.conectada);
  if(!contas.length){ $('lista').innerHTML = ''; const v = vazio('Nenhuma conta do Bling conectada', ''); const a = el('a', null, 'Conectar em Conexões e sistema → Bling (conexão)'); a.href = '/bling-conexao.html'; v.appendChild(a); $('lista').appendChild(v); $('btAtualizar').disabled = false; return; }
  $('lista').innerHTML = ''; $('lista').appendChild(el('p', 'carregando', 'Lendo as notas no Bling…'));
  const erros = [];
  const partes = await Promise.all(contas.map(async (c) => {
    try{ const r = await api('/api/bling/notas?conta=' + c.conta); return r.notas.map((n) => ({ ...n, conta: c.conta, nomeConta: c.nome || ('Conta ' + c.conta) })); }
    catch(e){ erros.push(`${c.nome || 'Conta ' + c.conta}: ${e.message}`); return []; }
  }));
  notas = partes.flat().sort((a, b) => String(a.data || '').localeCompare(String(b.data || '')));
  aviso(erros.length ? 'Não consegui ler: ' + erros.join(' · ') : '');
  $('lidoEm').textContent = 'Lido às ' + new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  desenhar();
  $('btAtualizar').disabled = false;
}

function vazio(t, sub){ const d = el('div', 'vazio-grande'); d.appendChild(el('b', null, t)); if(sub) d.appendChild(el('span', null, sub)); return d; }

function desenharAbas(){
  const box = $('abas'); box.innerHTML = '';
  const contas = (cfg?.contas || []).filter((c) => c.conectada);
  if(!contas.some((c) => c.conta === aba)) aba = '';
  const opcoes = [['', 'Todas'], ...contas.map((c) => [c.conta, 'Bling ' + (c.nome || 'Conta ' + c.conta)])];
  for(const [v, rot] of opcoes){
    const b = el('button', v === aba ? 'ativa' : null, rot); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', v === aba);
    const falta = notas.filter((n) => (!v || n.conta === v) && estado(n) !== 'emitir').length;
    const total = notas.filter((n) => !v || n.conta === v).length;
    b.appendChild(el('span', falta ? 'tem' : null, String(total)));
    b.onclick = () => { aba = v; try{ localStorage.setItem('bling_aba', v); }catch{} desenhar(); };
    box.appendChild(b);
  }
}

function desenhar(){
  desenharAbas();
  const daAba = notas.filter((n) => !aba || n.conta === aba);
  const conta = { ajustar: 0, emitir: 0, rej: 0 };
  for(const n of daAba) conta[estado(n)]++;
  $('nAjustar').textContent = conta.ajustar; $('nEmitir').textContent = conta.emitir; $('nRej').textContent = conta.rej;
  for(const b of document.querySelectorAll('.num')) b.classList.toggle('ativo', b.dataset.f === filtro);
  const box = $('lista'); box.innerHTML = '';
  const mostrar = daAba.filter((n) => !filtro || estado(n) === filtro);
  if(!daAba.length){ box.appendChild(vazio('Tudo em dia ✓', 'Nenhuma nota pendente no Bling. Gere a nota do pedido no Bling e clique em Atualizar.')); return; }
  if(!mostrar.length){ box.appendChild(vazio('Nada neste filtro', 'Clique em "Mostrar todas".')); return; }
  // as que faltam ajustar primeiro
  const ordem = { ajustar: 0, rej: 1, emitir: 2 };
  for(const n of mostrar.slice().sort((a, b) => ordem[estado(a)] - ordem[estado(b)])) box.appendChild(cartaoNota(n));
}

function cartaoNota(n){
  const est = estado(n);
  const d = el('article', 'nota' + (est === 'emitir' ? ' ok' : est === 'rej' ? ' rej' : ''));
  const cab = el('header');
  cab.appendChild(el('h3', null, `Nota ${n.numero || '(sem número)'}`));
  cab.appendChild(el('span', 'etq ' + (est === 'rej' ? 'rej' : est), est === 'ajustar' ? 'Falta ajustar' : est === 'emitir' ? 'Ajustada · falta emitir no Bling' : 'Rejeitada · corrigir no Bling'));
  cab.appendChild(el('span', 'etq', n.nomeConta));
  const loja = lojaPeloPedido(n.pedido_loja);
  cab.appendChild(el('span', 'info', [loja, n.pedido_loja ? 'pedido ' + n.pedido_loja : null, dia(n.data), reais(n.valor)].filter(Boolean).join(' · ')));
  d.appendChild(cab);

  const rolar = el('div', 'rolar'), t = el('table'), tr0 = el('tr');
  for(const h of ['Código', 'Nome na nota', 'NCM', 'Origem do ICMS', 'Qtd']) tr0.appendChild(el('th', null, h));
  t.appendChild(tr0);
  const campos = [], editavel = Number(n.situacao) === 1;
  for(const it of n.itens){
    const tr = el('tr');
    const tdCod = el('td', 'codigo');
    if(it.codigo){ const s = el('s', null, it.codigo); tdCod.append(s, el('div', 'antes', editavel ? 'sai vazio' : '')); } else tdCod.appendChild(el('span', 'salvo', 'vazio ✓'));
    const tdNome = el('td'), nome = el('input'); nome.maxLength = 120; nome.value = it.sugestao.descricao; nome.disabled = !editavel; tdNome.appendChild(nome);
    if(it.sugestao.salvo) tdNome.appendChild(el('div', 'salvo', 'nome guardado deste produto'));
    if(it.descricao && it.descricao !== it.sugestao.descricao){ nome.classList.add('mudou'); tdNome.appendChild(el('div', 'antes', 'na nota hoje: ' + it.descricao)); }
    const tdNcm = el('td'), ncm = el('input', 'ncm'); ncm.value = it.sugestao.ncm; ncm.maxLength = 10; ncm.disabled = !editavel; tdNcm.appendChild(ncm);
    if((it.ncm || '') !== it.sugestao.ncm){ ncm.classList.add('mudou'); tdNcm.appendChild(el('div', 'antes', 'na nota hoje: ' + (it.ncm || 'vazio'))); }
    const tdOr = el('td'), sel = el('select'); sel.disabled = !editavel;
    for(const nac of [false, true]){ const o = el('option', null, ORIGEM_TXT[origemDe(n.conta, nac)]); o.value = nac ? '1' : '0'; sel.appendChild(o); }
    sel.value = it.sugestao.nacional ? '1' : '0'; tdOr.appendChild(sel);
    if(Number(it.origem) !== it.sugestao.origem){ sel.classList.add('mudou'); tdOr.appendChild(el('div', 'antes', 'na nota hoje: ' + (it.origem == null ? '—' : (ORIGEM_TXT[it.origem] || it.origem)))); }
    tr.append(tdCod, tdNome, tdNcm, tdOr, el('td', null, it.quantidade ?? '—'));
    t.appendChild(tr);
    campos.push({ i: it.i, nome, ncm, sel });
  }
  rolar.appendChild(t); d.appendChild(rolar);

  const acoes = el('div', 'acoes'), res = el('div', 'res');
  if(editavel){
    const bt = el('button', 'bt primario', est === 'emitir' ? 'Ajustar de novo' : 'Ajustar no Bling'); bt.type = 'button';
    bt.onclick = async () => {
      const itens = campos.map((c) => ({ i: c.i, descricao: c.nome.value, ncm: c.ncm.value, nacional: c.sel.value === '1' }));
      const lista = itens.map((x) => `• ${x.descricao.trim()} — NCM ${x.ncm.trim()} — origem ${origemDe(n.conta, x.nacional)}`).join('\n');
      if(!confirm(`Ajustar a nota ${n.numero || ''} no Bling (${n.nomeConta})?\n\n${lista}\n\nO código do produto sai vazio. A nota NÃO é emitida: emita no Bling depois de conferir.`)) return;
      bt.disabled = true; res.className = 'res'; res.textContent = 'Ajustando no Bling…';
      try{
        const r = await enviar('POST', '/api/bling/notas/corrigir', { conta: n.conta, id: n.id, itens });
        if(r.tudo_certo){
          Object.assign(n, r.nota, { conta: n.conta, nomeConta: n.nomeConta });
          aviso(`Nota ${n.numero || ''} ajustada e conferida. Falta emitir no Bling.`, 'ok');
          desenhar();
        } else {
          res.className = 'res erro';
          res.textContent = 'O Bling aceitou, mas na releitura não bateu: ' + r.conferencia.filter((c) => !c.tudo)
            .map((c) => `item ${c.i + 1} (${['nome', 'codigo', 'ncm', 'origem'].filter((k) => !c[k]).join(', ')})`).join('; ') + '. Confira a nota no Bling.';
          bt.disabled = false;
        }
      }catch(e){ res.className = 'res erro'; res.textContent = 'Não ajustou: ' + e.message; bt.disabled = false; }
    };
    acoes.appendChild(bt);
    if(est === 'emitir') acoes.appendChild(el('span', 'res ok', '✓ Pronta: abra no Bling, confira e emita.'));
  } else acoes.appendChild(el('span', 'res erro', 'A Sefaz rejeitou esta nota: veja o motivo e corrija no Bling.'));
  acoes.appendChild(res);
  d.appendChild(acoes);
  return d;
}

for(const b of document.querySelectorAll('.num')) b.onclick = () => { filtro = filtro === b.dataset.f ? null : b.dataset.f; desenhar(); };
$('btTodas').onclick = () => { filtro = null; desenhar(); };
$('btAtualizar').onclick = lerNotas;

async function carregar(){
  try{ cfg = await api('/api/bling/config'); }catch(e){ aviso(e.message); }
}

carregar().then(lerNotas);
</script>
<script src="/sino.js?v=6" defer></script>
</body>
</html>
