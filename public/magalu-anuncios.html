<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anúncios Magalu</title>
<link rel="stylesheet" href="/paginas.css?v=1">
<link rel="stylesheet" href="/layout.css?v=2">
<link rel="stylesheet" href="/tema-hn.css?v=4">
<link rel="stylesheet" href="/tema-painel.css?v=3">
<link rel="stylesheet" href="/tema-escuro.css?v=4">
<link rel="stylesheet" href="/tema-escuro-paginas.css?v=1">
<script src="/tema.js?v=1"></script>
<style>
  .chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#eef1f6;color:#475569;white-space:nowrap}
  .chip.verde{background:#e6f4ea;color:#0b6b33}.chip.amarelo{background:#fff4d6;color:#7a5600}.chip.cinza{background:#f1f3f6;color:#64748b}
  td.dinheiro{white-space:nowrap;text-align:right}
  .pos{color:#0b6b33}.neg{color:#b42318;font-weight:700}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
  .filtros input[type=search]{flex:1 1 240px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #d5d7db;border-radius:9px}
  .seg{display:inline-flex;border:1px solid #d5d7db;border-radius:10px;overflow:hidden;flex-wrap:wrap}
  .seg button{font:inherit;font-size:13px;padding:7px 12px;border:0;background:#fff;cursor:pointer;color:#334155}
  .seg button[aria-pressed="true"]{background:#0086ff;color:#fff}
  .sku-painel{display:flex;flex-direction:column;gap:3px}
  .sku-painel input{width:190px;font:inherit;font-size:12px;padding:4px 7px;border:1px solid #d5d7db;border-radius:7px}
  .sku-painel input.salvo{border-color:#86c79a;background:#f3fbf5}
  .riscado{text-decoration:line-through;color:#94a3b8;font-size:11px;display:block}
  #msg.ok{background:#e6f4ea;color:#0b6b33;border-color:#b7e1c4}
  /* "abaixo de [x] %" dentro do grupo de filtros, logo depois do botão "Margem abaixo de" */
  .seg .margem-max{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:0 10px 0 6px;margin:0;border-left:1px solid var(--line,#e3e8f0)}
  .seg .margem-max input{width:58px;font:inherit;font-size:13px;padding:4px 6px;border:1px solid #d5d7db;border-radius:7px}
  .filtros .seg{flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca" id="marcaPainel"></div>
    <nav id="menuPainel" aria-label="Telas do painel"></nav>
    <script src="/menu.js?v=36"></script>
  </aside>
  <div class="conteudo">
<header>
  <h1>Anúncios — Magalu</h1>
  <div id="barraContas">
    <label for="selConta" id="rotuloConta">Conta</label>
    <select id="selConta" aria-describedby="rotuloConta"></select>
  </div>
</header>
<main>
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="topo">
    <p>Os anúncios da sua loja na Magalu, com preço, estoque, vendas de 30 dias e o lucro estimado em cada um. Quando o anúncio usa um código da Magalu no lugar do seu SKU, digite o <b>SKU do painel</b> (ex.: KIT-630): ele passa a dar o custo do produto aqui e nos Pedidos.</p>
    <button type="button" class="bt" id="btMargemMassa" title="Novo preço dos anúncios do filtro pela margem desejada">Preço pela margem</button>
    <button type="button" class="bt" id="btReler">Atualizar da Magalu</button>
  </div>
  <div class="cartoes" id="cartoes"><p class="carregando">Carregando…</p></div>
  <section class="bloco">
    <div class="filtros">
      <div class="seg" role="group" aria-label="Filtro" id="segFiltro">
        <button type="button" data-f="publicados" aria-pressed="true">Publicados</button>
        <button type="button" data-f="semcusto" aria-pressed="false">Sem custo</button>
        <button type="button" data-f="vendem" aria-pressed="false">Venderam em 30 dias</button>
        <button type="button" data-f="promocao" aria-pressed="false">Em promoção</button>
        <button type="button" data-f="pausados" aria-pressed="false">Pausados</button>
        <button type="button" data-f="baixa" aria-pressed="false">Margem abaixo de</button>
        <label class="margem-max"><input id="fMargemMax" type="number" step="1" min="-100" max="100" value="10" aria-label="Margem máxima em %"> %</label>
        <button type="button" data-f="todos" aria-pressed="false">Todos</button>
      </div>
      <input type="search" id="busca" placeholder="Buscar por título ou SKU" aria-label="Buscar anúncio">
    </div>
    <p class="sub" id="nota"></p>
    <div class="tabela-rolagem" id="lista"></div>
    <button type="button" class="bt" id="btMais" hidden>Mostrar mais</button>
  </section>
</main>
  </div>
</div>
<script src="/comum.js?v=8"></script>
<script src="/composicao.js?v=1"></script>
<script src="/margem-massa.js?v=2"></script>
<script>
function aviso(t, tipo){ const m = $('msg'); m.className = tipo === 'ok' ? 'ok' : ''; m.textContent = t; m.style.display = t ? 'block' : 'none'; }
function cartao(rot, valor, nota){ const c = el('div', 'cartao'); c.append(el('p', 'rotulo', rot), el('div', 'valor', valor), el('p', 'nota', nota || '')); return c; }
const SIT = { PUBLISHED: ['publicado', 'verde'], UNPUBLISHED: ['despublicado', 'cinza'], BLOCKED: ['bloqueado', 'amarelo'], NEW: ['novo', 'cinza'] };
let dados = null, filtro = 'publicados', mostrar = 200, espera = null;

// lucro estimado por unidade no preço atual: preço − taxa média do SKU (comissão, tarifas e frete
// no financeiro) − imposto − custo − embalagem (uma por pedido)
function lucroDe(a){
  if(a.preco == null || a.custo_unit == null || a.taxa_pct == null) return null;
  return a.preco - a.preco * a.taxa_pct - a.preco * (dados.imposto_pct || 0) / 100 - a.custo_unit - (dados.embalagem_pedido || 0);
}

async function carregar(recarregar){
  try{
    const novos = await api('/api/magalu/anuncios' + (recarregar ? '?recarregar=1' : ''));
    clearTimeout(espera);
    // preço sendo digitado: não repinta por cima (tenta de novo depois)
    if(!recarregar && dados && MargemMassa.editando()){ espera = setTimeout(() => carregar(false), 6000); return; }
    dados = novos;
    pintar();
    if(dados.lendo) espera = setTimeout(() => carregar(false), 6000);
  }catch(e){ aviso(e.message); $('cartoes').innerHTML = ''; }
}

function pintar(){
  const a = dados.itens;
  const pub = a.filter((x) => x.status === 'PUBLISHED');
  const semCusto = pub.filter((x) => x.custo_unit == null);
  const box = $('cartoes'); box.innerHTML = '';
  box.append(cartao('Anúncios publicados', numero(pub.length), `${numero(a.length)} no total`),
    cartao('Publicados sem custo', numero(semCusto.length), semCusto.length ? 'digite o SKU do painel neles' : 'todos com custo'),
    cartao('Venderam em 30 dias', numero(a.filter((x) => x.vendas_30).length), `${numero(a.reduce((s, x) => s + x.vendas_30, 0))} unidade(s)`));
  $('nota').textContent = dados.lendo
    ? `Lendo preço e estoque na Magalu (um anúncio por vez${dados.faltam != null ? `, faltam ${numero(dados.faltam)}` : ''}). A lista se atualiza sozinha.`
    : `Preço e estoque lidos ${dados.lido_em ? 'em ' + new Date(dados.lido_em).toLocaleString('pt-BR') : ''}; relidos a cada 6 h. Lucro estimado = preço − taxa média do SKU na Magalu (comissão, tarifas e frete; sem venda, a média da loja) − imposto (${numero(dados.imposto_pct)}%) − custo − embalagem.`;
  pintarLista();
}

// margem escolhida no filtro "Margem abaixo de" (padrão 10%)
const margemMax = () => (Number(String($('fMargemMax').value).replace(',', '.')) || 0) / 100;
$('fMargemMax').oninput = () => { if(filtro !== 'baixa'){ $('segFiltro').querySelector('[data-f="baixa"]').click(); return; } if(filtro === 'baixa' && dados){ mostrar = 200; pintarLista(); } };

// Preço pela margem em massa: os anúncios do filtro da tela. Preço = (custo + embalagem) ÷ (1 − taxa média − imposto − margem).
function precoPelaMargem(a, m){
  if(a.custo_unit == null || a.taxa_pct == null) return null;
  const sobra = 1 - a.taxa_pct - (dados.imposto_pct || 0) / 100 - m;
  return sobra > 0.01 ? Math.ceil((a.custo_unit + (dados.embalagem_pedido || 0)) / sobra * 100) / 100 : null;
}
let naTela = [];
$('btMargemMassa').onclick = () => {
  if(!naTela.length) return aviso('Nenhum anúncio na tela.');
  MargemMassa.abrir({ canal: 'Magalu', itens: naTela.slice(0, 500).filter((a) => a.preco != null).map((a) => ({ chave: a.sku, titulo: a.titulo, sub: a.sku + (a.sku_painel ? ' · ' + a.sku_painel : ''),
      preco: a.preco, precoPara: (m) => precoPelaMargem(a, m), margemEm: (p) => { const lu = lucroDe({ ...a, preco: p }); return lu == null || !p ? null : lu / p; }, a })),
    nota: 'A Magalu confere cada preço lendo de novo; se o primeiro não confirmar, o painel para.',
    aplicar: async (lista, andamento) => {
      const out = [];
      for(const [k, x] of lista.entries()){
        try{
          const r = await api('/api/magalu/anuncios/preco', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sku: x.item.a.sku, preco: x.preco }) });
          if(r.pendente) out.push({ chave: x.item.chave, ok: true, texto: 'enviado; a Magalu aplica em alguns minutos (confira no site)' });
          else { x.item.a.preco = r.preco; out.push({ chave: x.item.chave, ok: true, texto: 'preço mudado (conferido)' }); }
        }catch(e){
          out.push({ chave: x.item.chave, ok: false, erro: e.message });
          if(k === 0){ for(const y of lista.slice(1)) out.push({ chave: y.item.chave, ok: false, erro: 'não tentado: o primeiro não confirmou' }); break; }
        }
        andamento(k + 1);
      }
      pintarLista();
      return out;
    } });
};

function pintarLista(){
  const q = $('busca').value.trim().toLowerCase();
  const itens = dados.itens.filter((x) => {
    if(filtro === 'publicados' && x.status !== 'PUBLISHED') return false;
    if(filtro === 'semcusto' && (x.custo_unit != null || x.status !== 'PUBLISHED')) return false;
    if(filtro === 'vendem' && !x.vendas_30) return false;
    if(filtro === 'promocao' && !(x.preco_lista && x.preco != null && x.preco_lista > x.preco + 0.009)) return false;
    if(filtro === 'pausados' && x.status === 'PUBLISHED') return false;
    if(filtro === 'baixa'){ const lu = lucroDe(x); if(lu == null || !x.preco || lu / x.preco >= margemMax()) return false; }
    if(q && ![x.titulo, x.sku, x.sku_painel].some((t) => (t || '').toLowerCase().includes(q))) return false;
    return true;
  });
  naTela = itens;
  const box = $('lista'); box.innerHTML = '';
  if(!itens.length){ box.appendChild(el('p', 'vazio', dados.itens.length ? 'Nenhum anúncio com esse filtro.' : 'Lendo os anúncios da Magalu…')); $('btMais').hidden = true; return; }
  const t = el('table'); const cab = el('tr');
  for(const h of ['Anúncio', 'SKU do painel', 'Custo', 'Preço', 'Estoque', 'Situação', 'Vendas 30d', 'Taxa', 'Lucro/un.', 'Novo preço']) cab.appendChild(el('th', null, h));
  t.appendChild(cab);
  for(const a of itens.slice(0, mostrar)){
    const tr = el('tr');
    const vinc = el('td'); const box2 = el('label', 'sku-painel');
    const inp = el('input'); inp.value = a.sku_painel || ''; inp.placeholder = /^\d+$/.test(a.sku) ? 'ex.: KIT-630' : 'só se for outro';
    inp.setAttribute('aria-label', 'SKU do painel para ' + a.sku); if(a.sku_painel) inp.classList.add('salvo');
    inp.title = 'SKU do painel (o mesmo da tabela de custos). Enter para salvar; vazio apaga.';
    inp.addEventListener('keydown', (ev) => { if(ev.key === 'Enter') inp.blur(); });
    inp.addEventListener('change', async () => {
      inp.disabled = true;
      try{
        const r = await api('/api/magalu/sku-vinculo', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sku: a.sku, sku_painel: inp.value }) });
        a.sku_painel = r.sku_painel; a.custo_unit = r.custo_unit ?? null;
        aviso(r.sku_painel ? (r.custo_unit != null ? `${a.sku} ligado a ${r.sku_painel}: custo ${real(r.custo_unit)}.` : `${a.sku} ligado a ${r.sku_painel}, mas falta custo na tabela: ${(r.faltando || []).join(', ')}.`) : `Vínculo de ${a.sku} apagado.`, 'ok');
        carregar(false);
      }catch(e){ aviso(e.message); inp.disabled = false; }
    });
    box2.appendChild(inp); vinc.appendChild(box2);
    vinc.appendChild(Composicao.botao(a.sku_painel || a.sku, { titulo: a.titulo, aoSalvar: () => setTimeout(() => carregar(false), 1300) }));
    const custo = el('td', 'dinheiro');
    if(a.custo_unit == null) custo.appendChild(el('span', 'chip amarelo', a.faltando?.length ? 'sem custo: ' + a.faltando.join(', ') : 'sem custo'));
    else { custo.textContent = real(a.custo_unit); if(a.componentes.length > 1) custo.title = a.componentes.map((c) => `${c.sku}: ${real(c.custo)}`).join('\n'); }
    const preco = el('td', 'dinheiro');
    if(a.preco == null) preco.textContent = a.preco_lido ? '—' : '…';
    else { if(a.preco_lista && a.preco_lista > a.preco + 0.009) preco.appendChild(el('span', 'riscado', real(a.preco_lista))); preco.appendChild(document.createTextNode(real(a.preco))); }
    const sit = el('td'); sit.appendChild(el('span', 'chip ' + (SIT[a.status]?.[1] || ''), SIT[a.status]?.[0] || a.status || '—'));
    const lu = lucroDe(a);
    const luTd = el('td', 'dinheiro ' + (lu == null ? '' : lu < 0 ? 'neg' : 'pos'), lu == null ? '—' : real(lu));
    if(lu != null && a.preco) luTd.appendChild(el('span', 'pequeno', pct(lu / a.preco) + ' do preço'));
    const tx = el('td', null, a.taxa_pct == null ? '—' : pct(a.taxa_pct)); if(a.taxa_pct != null && !a.taxa_do_produto) tx.title = 'Média da loja (este SKU não vendeu em 90 dias)';
    tr.append(celulaProduto(a.foto, a.titulo || a.sku, 'SKU Magalu ' + a.sku, a.link), vinc, custo, preco, el('td', null, a.estoque == null ? '…' : numero(a.estoque)), sit,
      el('td', null, numero(a.vendas_30)), tx, luTd,
      // um anúncio: PUT do preço e a Magalu é lida de novo para conferir
      MargemMassa.celula({ nome: `${a.titulo || a.sku} (${a.sku})`, canal: 'Magalu', preco: a.preco, aviso,
        bloqueio: a.preco == null ? (a.preco_lido ? 'sem preço lido' : 'lendo o preço…') : null,
        precoPara: (m) => precoPelaMargem(a, m),
        estimar: (p) => { const lu = lucroDe({ ...a, preco: p }); return lu == null ? null : { lucro: lu, margem: p ? lu / p : null }; },
        extra: a.preco_lista && a.preco_lista > a.preco + 0.009 ? 'Em promoção: confira na Magalu se a promoção continua depois da mudança.' : null,
        salvar: async (v) => {
          const r = await api('/api/magalu/anuncios/preco', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sku: a.sku, preco: v }) });
          // medido 14/10/2026: a Magalu aplica em alguns MINUTOS e a leitura de preço da API demora mais que o site para mudar
          if(r.pendente) return `Preço de ${real(v)} enviado à Magalu para ${a.sku}${r.trace_id ? " (protocolo " + r.trace_id + ")" : ""}. Ela leva alguns minutos para aplicar: confira no site da Magalu e não envie de novo antes disso (a leitura do painel ainda mostra ${r.lido != null ? real(r.lido) : "o preço antigo"}).`;
          a.preco = r.preco; setTimeout(pintarLista, 50);
          return `Preço de ${a.sku} mudado para ${real(r.preco)} na Magalu (conferido).`;
        } }));
    t.appendChild(tr);
  }
  box.appendChild(t);
  $('btMais').hidden = itens.length <= mostrar;
  $('btMais').textContent = `Mostrar mais (${numero(itens.length - mostrar)} restantes)`;
}
$('segFiltro').onclick = (ev) => { const b = ev.target.closest('button'); if(!b) return; filtro = b.dataset.f; for(const x of $('segFiltro').querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b)); mostrar = 200; pintarLista(); };
$('busca').oninput = () => { mostrar = 200; pintarLista(); };
$('btMais').onclick = () => { mostrar += 200; pintarLista(); };
$('btReler').onclick = () => carregar(true);
carregar(false);
</script>
<script src="/sino.js?v=4" defer></script>
</body>
</html>
